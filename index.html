<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>FinTrack</h2>

    <nav>
      <a class="active">📊 Dashboard</a>
      <a>💳 Transactions</a>
      <a>📈 Analytics</a>
      <a>⚙️ Settings</a>
    </nav>

    <div class="user-box">
      <div class="avatar"></div>
      <div>
        <p>John</p>
        <small>Premium Plan</small>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <section class="top-cards">
      <div class="card balance">
        <h3>Total Balance</h3>
        <h1 id="balance">$0.00</h1>
      </div>

      <div class="card income">
        <h3>Income</h3>
        <p id="income">$0.00</p>
      </div>

      <div class="card expense">
        <h3>Expense</h3>
        <p id="expense">$0.00</p>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <h3>Add Transaction</h3>
        <form id="transaction-form">
          <input id="description" placeholder="Description">
          <input id="amount" type="number" placeholder="Amount">
          <button>Add</button>
        </form>
      </div>

      <div class="panel">
        <h3>Analytics</h3>
        <canvas id="categoryChart"></canvas>
      </div>
    </section>

    <section class="panel full">
      <h3>Transactions</h3>
      <ul id="transaction-list"></ul>
    </section>

  </main>

</div>
