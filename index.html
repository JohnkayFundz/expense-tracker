<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" aria-label="Main navigation">
    <h1 class="logo">FinTrack</h1>

    <nav class="sidebar-nav">
      <a href="#" class="active">📊 Dashboard</a>
      <a href="#">💳 Transactions</a>
      <a href="#">📈 Analytics</a>
      <a href="#">⚙️ Settings</a>
    </nav>

    <div class="user-box">
      <div class="avatar"></div>
      <div>
        <p>John</p>
        <small>Premium Plan</small>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">
      <div>
        <h2>Dashboard</h2>
        <p>Overview of your financial activity</p>
      </div>

      <div class="header-actions">
        <input type="search" placeholder="Search transactions...">
        <button type="button">+ New</button>
      </div>
    </header>

    <!-- STATS -->
    <section class="stats">
      <article class="card">
        <h3>Total Balance</h3>
        <p id="balance">$0.00</p>
      </article>

      <article class="card">
        <h3>Income</h3>
        <p id="income">$0.00</p>
      </article>

      <article class="card">
        <h3>Expense</h3>
        <p id="expense">$0.00</p>
      </article>
    </section>

    <!-- CONTENT GRID -->
    <section class="grid">

      <section class="panel">
        <h3>Add Transaction</h3>

        <form id="transaction-form">
          <input id="description" type="text" placeholder="Description" required>
          <input id="amount" type="number" placeholder="Amount" required>
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="panel">
        <h3>Analytics</h3>
        <canvas id="expenseChart"></canvas>
      </section>

    </section>

    <!-- TRANSACTIONS -->
    <section class="panel full">
      <h3>Transactions</h3>
      <ul id="transaction-list"></ul>
    </section>

  </main>

</div>

</body>
</html>
